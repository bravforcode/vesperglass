services:
  stocknomist:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stocknomist-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:18800:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
      - DATA_DIR=/app/data
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - ./data:/app/data
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: "0.50"
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
